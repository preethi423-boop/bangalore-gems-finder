name: Build Play Store Release (AAB & APK)

on:
  push:
    branches:
      - mobile-version
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Android app icons and splash from Namma Spot logo
        run: |
          python3 -m pip install --quiet pillow
          python3 - << 'EOF'
          import os, glob
          from PIL import Image

          src = Image.open("public/favicon.png").convert("RGBA")
          res = "android/app/src/main/res"

          def make_square(size, scale):
              canvas = Image.new("RGBA", (size, size), (255, 255, 255, 255))
              inner = int(size * scale)
              resized = src.copy()
              resized.thumbnail((inner, inner), Image.LANCZOS)
              x = (size - resized.width) // 2
              y = (size - resized.height) // 2
              canvas.paste(resized, (x, y), resized)
              return canvas

          for old in glob.glob(f"{res}/drawable*/ic_launcher_foreground.xml"):
              os.remove(old)

          densities = {
              "mdpi": (48, 108),
              "hdpi": (72, 162),
              "xhdpi": (96, 216),
              "xxhdpi": (144, 324),
              "xxxhdpi": (192, 432),
          }
          for d, (legacy_px, fg_px) in densities.items():
              folder = f"{res}/mipmap-{d}"
              os.makedirs(folder, exist_ok=True)
              make_square(legacy_px, 0.85).save(f"{folder}/ic_launcher.png")
              make_square(legacy_px, 0.85).save(f"{folder}/ic_launcher_round.png")
              make_square(fg_px, 0.62).save(f"{folder}/ic_launcher_foreground.png")

          os.makedirs(f"{res}/mipmap-anydpi-v26", exist_ok=True)
          adaptive_xml = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <background android:drawable="@color/ic_launcher_background"/>\n'
              '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
              '</adaptive-icon>\n'
          )
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              with open(f"{res}/mipmap-anydpi-v26/{name}", "w") as f:
                  f.write(adaptive_xml)

          os.makedirs(f"{res}/values", exist_ok=True)
          with open(f"{res}/values/ic_launcher_background.xml", "w") as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#FFFFFF</color>\n</resources>\n')

          for splash_path in glob.glob(f"{res}/drawable*/splash.png"):
              with Image.open(splash_path) as existing:
                  w, h = existing.size
              canvas = Image.new("RGBA", (w, h), (255, 255, 255, 255))
              side = int(min(w, h) * 0.45)
              logo = src.copy()
              logo.thumbnail((side, side), Image.LANCZOS)
              canvas.paste(logo, ((w - logo.width) // 2, (h - logo.height) // 2), logo)
              canvas.save(splash_path)
          print("All Android icons and splash screens updated.")
          EOF

      - name: Sync Capacitor Android
        run: |
          mkdir -p dist
          npx cap sync android

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/namma-spot.keystore

      - name: Build release AAB and APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/namma-spot.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: namma-spot-playstore-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: namma-spot-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
