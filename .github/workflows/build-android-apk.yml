name: Build Play Store Release (AAB & APK)

on:
  push:
    branches:
      - mobile-version
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Android app icons from Namma Spot logo
        run: |
          mkdir -p assets
          convert public/favicon.png -background white -gravity center -resize 860x860 -extent 1024x1024 assets/icon-only.png
          convert public/favicon.png -background white -gravity center -resize 660x660 -extent 1024x1024 assets/icon-foreground.png
          convert -size 1024x1024 xc:white assets/icon-background.png
          convert public/favicon.png -background white -gravity center -resize 900x900 -extent 2732x2732 assets/splash.png
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff'

      - name: Sync Capacitor Android
        run: |
          mkdir -p dist
          npx cap sync android

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/namma-spot.keystore

      - name: Build release AAB and APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/namma-spot.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: namma-spot-playstore-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: namma-spot-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
